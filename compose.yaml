services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_flow_lab
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payment_flow_lab']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
